<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="calculater.css" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <div class="card p-4 shadow-lg rounded" id="calculater">
      <h2 class="text-center mb-4">Simple Calculator</h2>
      <div class="row mb-3">
        <div class="col">
          <input type="number" id="num1" class="form-control" placeholder="Enter first number" />
        </div>
        <div class="col">
          <input type="number" id="num2" class="form-control" placeholder="Enter second number" />
        </div>
      </div>
      <div class="d-flex justify-content-around mb-3">
        <button class="btn btn-primary" onclick="calculate('+')">Add</button>
        <button class="btn btn-success" onclick="calculate('-')">Subtract</button>
        <button class="btn btn-warning" onclick="calculate('*')">Multiply</button>
        <button class="btn btn-danger" onclick="calculate('/')">Divide</button>
      </div>
      <div class="text-center">
        <h4>Result: <span id="result">0</span></h4>
      </div>
    </div>
  </div>

  <script src="calculater.js" defer></script>
</body>
</html>
